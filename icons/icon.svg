<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#5e2418"/>
<g transform="rotate(-12 256 270)">
  <!-- headstock + pegs -->
  <rect x="226" y="62" width="60" height="62" rx="12" fill="#3b2214"/>
  <g fill="#e9e2d6">
    <circle cx="214" cy="80" r="10"/><circle cx="214" cy="108" r="10"/>
    <circle cx="298" cy="80" r="10"/><circle cx="298" cy="108" r="10"/>
  </g>
  <!-- neck -->
  <rect x="240" y="118" width="32" height="90" fill="#3b2214"/>
  <g stroke="#c9b98f" stroke-width="3"><line x1="240" y1="140" x2="272" y2="140"/><line x1="240" y1="160" x2="272" y2="160"/><line x1="240" y1="178" x2="272" y2="178"/><line x1="240" y1="194" x2="272" y2="194"/></g>
  <!-- body -->
  <g fill="#a85a23">
    <circle cx="256" cy="262" r="80"/><circle cx="256" cy="362" r="96"/><rect x="190" y="262" width="132" height="100"/>
  </g>
  <g fill="#e3a050">
    <circle cx="256" cy="262" r="72"/><circle cx="256" cy="362" r="88"/><rect x="198" y="262" width="116" height="100"/>
  </g>
  <!-- strings -->
  <g stroke="#f6eee6" stroke-width="2.2" opacity=".8">
    <line x1="247" y1="120" x2="247" y2="404"/><line x1="253" y1="120" x2="253" y2="404"/>
    <line x1="259" y1="120" x2="259" y2="404"/><line x1="265" y1="120" x2="265" y2="404"/>
  </g>
  <!-- bridge -->
  <rect x="222" y="400" width="68" height="14" rx="5" fill="#3b2214"/>
  <!-- eye patch strap -->
  <path d="M178 214 L336 290" stroke="#17120f" stroke-width="9" stroke-linecap="round"/>
  <!-- eye patch -->
  <ellipse cx="222" cy="262" rx="27" ry="22" fill="#17120f" transform="rotate(-10 222 262)"/>
  <!-- fierce eye -->
  <ellipse cx="292" cy="264" rx="24" ry="20" fill="#ffffff" stroke="#17120f" stroke-width="5"/>
  <circle cx="285" cy="267" r="11" fill="#17120f"/>
  <circle cx="281" cy="263" r="3.5" fill="#ffffff"/>
  <!-- angry brow -->
  <path d="M262 226 L322 240 L320 252 L260 236 Z" fill="#17120f"/>
  <!-- soundhole as a snarl -->
  <ellipse cx="256" cy="336" rx="34" ry="24" fill="#2a160c"/>
  <path d="M226 326 L236 338 L246 326 L256 338 L266 326 L276 338 L286 326 Z" fill="#f6eee6"/>
</g>
</svg>
